<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaway — Monde 3D</title>
<!-- v2 : quartier résidentiel de luxe (ciel réaliste, verre PBR, jardins, piscines, personnages, voitures) -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0f14; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #canvasHost { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }

  #loading {
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; background:#0b0f14; color:#fff;
    transition:opacity .5s ease;
  }
  #loading .spinner {
    width:46px; height:46px; border-radius:50%;
    border:3px solid rgba(255,255,255,0.15); border-top-color:#8E44AD;
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading.hidden { opacity:0; pointer-events:none; }

  #fadeOverlay {
    position:fixed; inset:0; background:#000; opacity:0; pointer-events:none;
    z-index:40; transition:opacity .35s ease;
  }
  #fadeOverlay.active { opacity:1; }

  .top-bar {
    position:fixed; top:0; left:0; right:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; pointer-events:none;
  }
  .top-bar > * { pointer-events:auto; }

  #backBtn3d, #treeLinkBtn {
    background:rgba(20,24,30,0.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:#fff; border:1px solid rgba(255,255,255,0.12); padding:9px 18px; border-radius:50px;
    font-size:14px; font-weight:600; cursor:pointer; letter-spacing:.2px;
    box-shadow:0 6px 24px rgba(0,0,0,0.3); display:none;
  }
  #treeLinkBtn { display:inline-block; text-decoration:none; }
  #backBtn3d:hover, #treeLinkBtn:hover { background:rgba(30,34,42,0.75); }

  #breadcrumb3d {
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:30;
    background:rgba(20,24,30,0.55); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    color:rgba(255,255,255,0.85); padding:8px 20px; border-radius:50px; font-size:13px;
    border:1px solid rgba(255,255,255,0.1); max-width:70vw; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; pointer-events:none;
  }

  /* Person card shown when inside a house */
  #personCard {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(0);
    z-index:30; width:min(92vw, 420px);
    background:rgba(18,22,28,0.6); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(255,255,255,0.12); border-radius:22px; padding:18px 20px;
    color:#fff; box-shadow:0 20px 60px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none; transition:opacity .4s ease, transform .4s ease;
  }
  #personCard.show { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0); }
  #personCard .pc-row { display:flex; gap:14px; align-items:center; }
  #personCard .pc-photo {
    width:56px; height:56px; border-radius:50%; object-fit:cover; flex-shrink:0;
    border:2px solid rgba(255,255,255,0.25); background:#2C3E50;
  }
  #personCard .pc-name { font-size:18px; font-weight:700; letter-spacing:.2px; }
  #personCard .pc-meta { font-size:12px; color:rgba(255,255,255,0.55); margin-top:2px; }
  #personCard .pc-bio { margin-top:10px; font-size:13px; line-height:1.5; color:rgba(255,255,255,0.8); }
  #personCard .pc-actions { margin-top:14px; display:flex; gap:10px; }
  #personCard button {
    flex:1; padding:10px 14px; border-radius:14px; border:none; cursor:pointer;
    font-size:13px; font-weight:600; font-family:inherit;
  }
  #enterChildrenBtn { background:#8E44AD; color:#fff; }
  #enterChildrenBtn:hover { background:#a569bd; }
  #enterChildrenBtn:disabled { background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.35); cursor:default; }
  #exitHouseBtn { background:rgba(255,255,255,0.1); color:#fff; flex:none; padding:10px 22px; }
  #exitHouseBtn:hover { background:rgba(255,255,255,0.18); }

  #hint {
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:25;
    color:rgba(255,255,255,0.75); font-size:13px; background:rgba(20,24,30,0.45);
    backdrop-filter:blur(12px); padding:8px 18px; border-radius:50px;
    border:1px solid rgba(255,255,255,0.08); pointer-events:none; transition:opacity .3s ease;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div>Construction du monde familial…</div></div>
<div id="fadeOverlay"></div>
<div id="canvasHost"></div>

<div class="top-bar">
  <button id="backBtn3d">← Retour</button>
  <a id="treeLinkBtn" href="index.html">Vue arbre classique</a>
</div>
<div id="breadcrumb3d"></div>

<div id="hint">Touchez / cliquez la porte pour entrer</div>

<div id="personCard">
  <div class="pc-row">
    <img class="pc-photo" id="pcPhoto" src="ssi.jpg" alt="">
    <div>
      <div class="pc-name" id="pcName">—</div>
      <div class="pc-meta" id="pcMeta">—</div>
    </div>
  </div>
  <div class="pc-bio" id="pcBio"></div>
  <div class="pc-actions">
    <button id="exitHouseBtn">Retour</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js",
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="house3d.js"></script>
</body>
</html>
