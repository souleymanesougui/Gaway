<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaway - Chargement</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2C3E50 0%, #8E44AD 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            animation: fadeIn 0.5s ease;
        }

        .splash-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: tomber 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateY(-200px);
        }

        .splash-icon img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }

        .splash-words {
            display: flex;
            gap: 15px;
            font-size: 48px;
            font-weight: 800;
            color: white;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
        }

        .word-fils {
            animation: glisserGauche 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateX(-300px);
        }

        .word-gaida {
            animation: glisserDroite 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateX(300px);
        }

        .splash-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
            margin-top: 10px;
        }

        .splash-loader {
            width: 200px;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            animation: fadeIn 1.5s ease forwards;
            opacity: 0;
        }

        .splash-loader-bar {
            width: 0%;
            height: 100%;
            background: white;
            border-radius: 10px;
            animation: charger 2s ease forwards;
        }

        @keyframes tomber {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glisserGauche {
            0% {
                opacity: 0;
                transform: translateX(-300px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes glisserDroite {
            0% {
                opacity: 0;
                transform: translateX(300px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes charger {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @media (max-width: 600px) {
            .splash-icon {
                width: 90px;
                height: 90px;
            }
            .splash-words {
                font-size: 32px;
                gap: 10px;
            }
            .splash-subtitle {
                font-size: 11px;
                letter-spacing: 3px;
            }
            .splash-loader {
                width: 150px;
            }
        }

        @media (max-width: 400px) {
            .splash-words {
                font-size: 24px;
                gap: 8px;
            }
            .splash-icon {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="splash-icon">
            <img src="Images/gaway1.png" alt="Gaway">
        </div>
        <div class="splash-words">
            <span class="word-fils">FILS</span>
            <span class="word-gaida">GAIDA</span>
        </div>
        <div class="splash-subtitle">Arbre Généalogique</div>
        <div class="splash-loader">
            <div class="splash-loader-bar"></div>
        </div>
    </div>

    <script>
        // Vérifier si l'animation a déjà été vue
        const splashSeen = localStorage.getItem('splash_seen');
        
        // Si l'utilisateur a déjà vu l'animation, passer directement
        if (splashSeen) {
            window.location.href = 'index.html';
        } else {
            // Sinon, afficher l'animation puis rediriger
            setTimeout(() => {
                localStorage.setItem('splash_seen', 'true');
                window.location.href = 'index.html';
            }, 2500);
        }

        // EN CAS D'URGENCE : si la redirection ne fonctionne pas
        // Après 5 secondes, forcer la redirection
        setTimeout(() => {
            if (window.location.pathname.includes('splash')) {
                window.location.href = 'index.html';
            }
        }, 5000);
    </script>
</body>
</html>
