<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaway - Chargement</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2C3E50 0%, #44ad8f 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            animation: fadeIn 0.5s ease;
        }

        .splash-icon {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #44ad8f(255, 255, 255);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: tomber 1s ease forwards;
            opacity: 0;
        }

        .splash-icon img {
            width: 80%;
            height: 80%;
            object-fit: contain;
            border-radius: 50%;
        }

        .splash-words {
            display: flex;
            gap: 15px;
            font-size: 48px;
            font-weight: bold;
            color: white;
            letter-spacing: 2px;
        }

        .word-fils {
            animation: gauche 1s ease forwards;
            opacity: 0;
        }

        .word-gaida {
            animation: droite 1s ease forwards;
            opacity: 0;
        }

        .splash-subtitle {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            animation: fadeIn 1.5s forwards;
            opacity: 0;
        }

        .splash-loader {
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .splash-loader-bar {
            height: 100%;
            width: 0%;
            background: white;
            animation: charger 2.5s linear forwards;
        }


        @keyframes tomber {
            from {
                opacity: 0;
                transform: translateY(-200px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes gauche {
            from {
                opacity: 0;
                transform: translateX(-300px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes droite {
            from {
                opacity: 0;
                transform: translateX(300px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes charger {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }


        @media(max-width:600px){

            .splash-icon{
                width:90px;
                height:90px;
            }

            .splash-words{
                font-size:32px;
            }

            .splash-loader{
                width:150px;
            }
        }

    </style>
</head>

<body>

<div class="splash-container">

    <div class="splash-icon">
        <img src="Images/gaway1.png" alt="Gaway">
    </div>

    <div class="splash-words">
        <span class="word-fils">FILS</span>
        <span class="word-gaida">GAIDA</span>
    </div>

    <div class="splash-subtitle">
        Bienvenue dans l'univers Gaway du monde
    </div>

    <div class="splash-loader">
        <div class="splash-loader-bar"></div>
    </div>

</div>

<script>
sessionStorage.setItem("splash", "true");

setTimeout(() => {
    window.location.href = "index.html";
}, 5000);
</script>


</body>
</html>
